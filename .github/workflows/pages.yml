name: Deploy Pages

# 静态站点：仓库根即站点根，无构建步骤。
# 首次使用需在 Settings → Pages → Source 选择 "GitHub Actions"（一次操作）。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 先尝试用仓库 token 直接创建 Pages site；失败也不中断，由下一步给出明确结论
      - name: Enable Pages (best effort)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/pages" -f build_type=workflow \
            && echo "pages-enabled" || echo "pages-enable-failed"

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
